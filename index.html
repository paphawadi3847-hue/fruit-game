
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fruit Catcher Game</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 10px;
  text-align: center;
  font-family: sans-serif;
  background: linear-gradient(#a9e8ff,#eaffd5);
  color: #333;
  overflow-x: hidden;
}

h1 {
  color: #ed792d;
  font-size: clamp(25px,7vw,38px);
  margin: 10px;
}

.stats {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 7px;
  margin: 8px auto;
}

.stat {
  background: white;
  padding: 9px 11px;
  border-radius: 14px;
  font-size: clamp(13px,3.5vw,17px);
  font-weight: bold;
  box-shadow: 0 3px 6px #9995;
}

#gameArea {
  position: relative;
  width: min(95vw,400px);
  margin: 10px auto;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  background: linear-gradient(#a5e6ff,#e6ffd1);
  border: 4px solid white;
  border-radius: 16px;
  touch-action: none;
}

button {
  background: #ff8c42;
  border: none;
  color: white;
  padding: 12px 20px;
  border-radius: 22px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin: 6px;
}

button:active {
  transform: scale(.95);
}

.sound {
  background: #5c9fe8;
}

#result {
  display: none;
  position: absolute;
  z-index: 10;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 88%;
  max-width: 350px;
  background: rgba(255,255,255,.97);
  border: 4px solid #ffb347;
  border-radius: 22px;
  padding: 16px;
  box-shadow: 0 8px 25px #5557;
  line-height: 1.7;
  animation: appear .35s ease;
}

#result h2 {
  color: #e65d35;
  margin: 5px;
}

#result p {
  margin: 5px;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translate(-50%,-45%) scale(.8);
  }
  to {
    opacity: 1;
    transform: translate(-50%,-50%) scale(1);
  }
}

.info {
  font-size: 14px;
  color: #557;
}
</style>
</head>

<body>

<h1>🍎 Fruit Catcher 🍊</h1>
<p>เก็บผลไม้ให้ได้เยอะ ๆ ระวังระเบิดนะ!</p>

<div class="stats">
  <div class="stat">🏆 คะแนน: <span id="score">0</span></div>
  <div class="stat">❤️ ระเบิด: <span id="bombs">0</span>/3</div>
</div>

<div class="stats">
  <div class="stat">🍊 <span id="orange">0</span></div>
  <div class="stat">🍎 <span id="apple">0</span></div>
  <div class="stat">🍓 <span id="berry">0</span></div>
</div>

<div id="gameArea">
  <canvas id="game" width="400" height="550"></canvas>
  <div id="result"></div>
</div>

<div>
  <button id="startBtn" onclick="startGame()">
    ▶ เริ่มเกม
  </button>

  <button class="sound" id="soundBtn" onclick="toggleSound()">
    🔊 เปิดเสียง
  </button>
</div>

<p class="info">
  📱 ใช้นิ้วลากตะกร้าไปทางซ้ายและขวาเพื่อเก็บผลไม้
</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let basket, items;
let score = 0;
let bombs = 0;
let oranges = 0;
let apples = 0;
let berries = 0;

let playing = false;
let animation;
let spawnTimer = 0;
let lastTime = 0;

let audioContext;
let musicTimer;
let musicOn = true;
let musicStep = 0;

const fruits = [
  {emoji:"🍊",type:"orange",points:10},
  {emoji:"🍎",type:"apple",points:15},
  {emoji:"🍓",type:"berry",points:20},
  {emoji:"💣",type:"bomb",points:0}
];

// ===== เสียงเพลง =====

function initAudio() {
  if (!audioContext) {
    const AudioCtx =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioCtx) return;

    audioContext = new AudioCtx();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }
}

function playTone(freq,duration,type="sine",volume=.08) {
  if (!audioContext || !musicOn) return;

  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();

  osc.type = type;
  osc.frequency.value = freq;

  gain.gain.setValueAtTime(volume,audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audioContext.destination);

  osc.start();
  osc.stop(audioContext.currentTime+duration);
}

const melody = [
  523,659,784,659,
  587,698,880,698,
  523,659,784,1047,
  880,784,659,523
];

function playMusic() {
  stopMusic();

  if (!musicOn || !playing) return;

  musicStep = 0;

  musicTimer = setInterval(() => {
    if (!playing || !musicOn) return;

    playTone(melody[musicStep % melody.length],.22);
    musicStep++;
  },280);
}

function stopMusic() {
  if (musicTimer) {
    clearInterval(musicTimer);
    musicTimer = null;
  }
}

function toggleSound() {
  musicOn = !musicOn;

  document.getElementById("soundBtn").textContent =
    musicOn ? "🔊 เปิดเสียง" : "🔇 ปิดเสียง";

  if (musicOn) {
    initAudio();
    if (playing) playMusic();
  } else {
    stopMusic();
  }
}

function fruitSound() {
  playTone(880,.12,"sine",.10);
  setTimeout(() => {
    playTone(1100,.12,"sine",.08);
  },90);
}

function bombSound() {
  playTone(100,.35,"sawtooth",.15);
}

// ===== ระบบเกม =====

function resetGame() {
  basket = {
    x:160,
    y:490,
    w:80,
    h:35
  };

  items = [];
  score = 0;
  bombs = 0;
  oranges = 0;
  apples = 0;
  berries = 0;

  spawnTimer = 0;
  lastTime = 0;

  updateStats();
}

function updateStats() {
  document.getElementById("score").textContent = score;
  document.getElementById("bombs").textContent = bombs;
  document.getElementById("orange").textContent = oranges;
  document.getElementById("apple").textContent = apples;
  document.getElementById("berry").textContent = berries;
}

function drawBasket() {
  ctx.font = "65px sans-serif";
  ctx.textAlign = "center";

  ctx.fillText(
    "🧺",
    basket.x+basket.w/2,
    basket.y+40
  );
}

function drawItems() {
  items.forEach(item => {
    ctx.font = "32px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(item.emoji,item.x,item.y);
  });
}

function spawnItem() {
  const random = Math.random();
  let fruit;

  if (random < .20) fruit = fruits[3];
  else if (random < .47) fruit = fruits[0];
  else if (random < .74) fruit = fruits[1];
  else fruit = fruits[2];

  items.push({
    ...fruit,
    x:25+Math.random()*350,
    y:-20,
    speed:2+Math.random()*2.5
  });
}

function gameLoop(timestamp) {
  if (!playing) return;

  const delta = lastTime
    ? Math.min((timestamp-lastTime)/16.67,2)
    : 1;

  lastTime = timestamp;

  ctx.clearRect(0,0,400,550);

  spawnTimer += delta;

  if (spawnTimer > 38) {
    spawnItem();
    spawnTimer = 0;
  }

  items.forEach(item => {
    item.y += item.speed*delta;
  });

  items = items.filter(item => {

    if (
      item.y > basket.y-15 &&
      item.y < basket.y+basket.h &&
      item.x > basket.x-5 &&
      item.x < basket.x+basket.w+5
    ) {

      if (item.type === "bomb") {
        bombs++;
        bombSound();

        if (bombs >= 3) {
          updateStats();
          endGame();
          return false;
        }

      } else {
        score += item.points;

        if (item.type === "orange") oranges++;
        if (item.type === "apple") apples++;
        if (item.type === "berry") berries++;

        fruitSound();
      }

      updateStats();
      return false;
    }

    return item.y < 580;
  });

  drawItems();
  drawBasket();

  ctx.fillStyle = "#83c95b";
  ctx.fillRect(0,535,400,15);

  animation = requestAnimationFrame(gameLoop);
}

// ===== ควบคุมมือถือ =====

function moveBasket(clientX) {
  const rect = canvas.getBoundingClientRect();

  const x = (clientX-rect.left)*(400/rect.width);

  basket.x = Math.max(
    0,
    Math.min(320,x-basket.w/2)
  );
}

canvas.addEventListener("pointerdown",e => {
  if (!playing) return;

  canvas.setPointerCapture(e.pointerId);
  moveBasket(e.clientX);
});

canvas.addEventListener("pointermove",e => {
  if (!playing) return;

  if (e.pointerType === "mouse" && e.buttons === 0) return;

  moveBasket(e.clientX);
});

// ===== ควบคุมคอมพิวเตอร์ =====

document.addEventListener("keydown",e => {
  if (!playing) return;

  if (e.key === "ArrowLeft") basket.x -= 25;
  if (e.key === "ArrowRight") basket.x += 25;

  basket.x = Math.max(0,Math.min(320,basket.x));
});

// ===== เริ่มเกม =====

function startGame() {
  cancelAnimationFrame(animation);
  stopMusic();

  initAudio();
  resetGame();

  playing = true;

  document.getElementById("result").style.display = "none";

  document.getElementById("startBtn").textContent =
    "🔄 เริ่มเกมใหม่";

  playMusic();

  animation = requestAnimationFrame(gameLoop);
}

// ===== จบเกมและแสดงคะแนนบนหน้าจอ =====

function endGame() {
  playing = false;

  cancelAnimationFrame(animation);
  stopMusic();

  const result = document.getElementById("result");

  result.style.display = "block";

  result.innerHTML = `
    <h2>💥 GAME OVER!</h2>

    <h2 style="color:#ed8b25">
      🏆 ${score} คะแนน
    </h2>

    <hr>

    <h3>📊 สรุปผลการเล่น</h3>

    <p>🍊 ส้ม: ${oranges} ลูก</p>
    <p>🍎 แอปเปิ้ล: ${apples} ลูก</p>
    <p>🍓 สตรอว์เบอร์รี: ${berries} ลูก</p>

    <hr>

    <p>💣 ระเบิด: ${bombs}/3</p>

    <h3>
      🎉 ผลไม้ทั้งหมด:
      ${oranges+apples+berries} ลูก
    </h3>

    <button onclick="startGame()">
      🔄 เล่นอีกครั้ง
    </button>
  `;

  document.getElementById("startBtn").textContent =
    "🔄 เล่นอีกครั้ง";
}

// ===== หน้าจอเริ่มต้น =====

resetGame();

ctx.font = "28px sans-serif";
ctx.textAlign = "center";
ctx.fillText("กดเริ่มเกมเพื่อเล่น!",200,250);

</script>

</body>
</html>
